x-app: &app
  image: auth-template:local
  build:
    context: .
    target: runtime
  env_file: .env

services:
  api:
    <<: *app
    environment:
      HTTP__HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${HTTP__PORT:-8000}:${HTTP__PORT:-8000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('HTTP__PORT', '8000') + '/openapi.json', timeout=3)"
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
  migrate:
    <<: *app
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
  postgres_test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth-test-only
      POSTGRES_DB: auth_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_test -d auth_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    image: auth-template:dev
    build:
      context: .
      target: development
    profiles: [test]
    environment:
      TEST_DATABASE_DSN: postgresql+psycopg://auth_test:auth-test-only@postgres_test:5432/auth_test
    depends_on:
      postgres_test:
        condition: service_healthy
volumes:
  postgres_data:
